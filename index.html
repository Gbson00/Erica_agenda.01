<script>
    // ==========================================
    // CONFIGURAÇÕES DA ERICA
    // ==========================================
    const WHATSAPP_ERICA = "554198313478";

    // Conexão com o seu banco Supabase
    const SUPABASE_URL = "https://wuvjambyzkawwhtigfom.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pUdhkkYjxwImh3LK4KiAWw_5nb7cNlJ";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const SERVICOS = [
      { id: 1, nome: "Design de Sobrancelha", preco: "25,00", duracao: "1H30", tema: "card-purple" },
      { id: 2, nome: "Design de Henna", preco: "40,00", duracao: "1H30", tema: "card-light" },
      { id: 3, nome: "Peeling de Diamante", preco: "59,90", duracao: "1H30", tema: "card-dark" },
      { id: 4, nome: "Drenagem", preco: "79,90", duracao: "1H30", tema: "card-purple" },
      { id: 5, nome: "Limpeza de Pele", preco: "99,90", duracao: "1H30", tema: "card-light" },
      { id: 6, nome: "Microagulhamento", preco: "99,90", duracao: "1H30", tema: "card-dark" },
      { id: 7, nome: "Brow Lamination", preco: "99,90", duracao: "1H30", tema: "card-purple" },
      { id: 8, nome: "Lash Lifting", preco: "99,90", duracao: "1H30", tema: "card-light" }
    ];

    const HORARIOS_SABADO = ["09:00", "10:30", "12:30", "14:00", "15:30"];

    let servicoSelecionado = null;
    let sabadoSelecionado = null;
    let horarioSelecionado = null;
    let agendamentosOcupados = [];

    function carregarServicos() {
      const container = document.getElementById("servicesView");
      container.innerHTML = "";

      SERVICOS.forEach(servico => {
        const [reais, centavos] = servico.preco.split(",");
        const card = document.createElement("div");
        card.className = `service-card ${servico.tema}`;
        card.onclick = () => abrirAgendamento(servico);

        card.innerHTML = `
          <span class="duration">${servico.duracao}</span>
          <div class="price-circle">
            <span class="currency">R$</span>
            <span class="amount">${reais}<span class="cents">,${centavos}</span></span>
          </div>
          <h3 class="service-title">${servico.nome}</h3>
          <span class="cta-text">Agendar →</span>
        `;
        container.appendChild(card);
      });
    }

    function obterProximosSabados(quantidade = 6) {
      const sabados = [];
      const hoje = new Date();
      let data = new Date(hoje);

      const diasParaSabado = (6 - data.getDay() + 7) % 7;
      data.setDate(data.getDate() + diasParaSabado);

      for (let i = 0; i < quantidade; i++) {
        const dia = String(data.getDate()).padStart(2, "0");
        const mes = String(data.getMonth() + 1).padStart(2, "0");
        const ano = data.getFullYear();

        sabados.push({
          iso: `${ano}-${mes}-${dia}`,
          label: `Sáb, ${dia}/${mes}`
        });

        data.setDate(data.getDate() + 7);
      }
      return sabados;
    }

    async function buscarHorariosOcupados() {
      const grid = document.getElementById("timesGrid");
      grid.innerHTML = `<div class="loading-text">A verificar horários livres...</div>`;

      const { data, error } = await db
        .from("agendamentos")
        .select("data, hora");

      if (!error && data) {
        agendamentosOcupados = data;
      }
      renderizarHorarios();
    }

    async function abrirAgendamento(servico) {
      servicoSelecionado = servico;
      sabadoSelecionado = null;
      horarioSelecionado = null;

      document.getElementById("chosenServiceName").innerText = servico.nome;
      document.getElementById("chosenServicePrice").innerText = `R$ ${servico.preco}`;

      const sabados = obterProximosSabados(6);
      sabadoSelecionado = sabados[0];

      renderizarSabados(sabados);

      document.getElementById("servicesView").style.display = "none";
      document.getElementById("mainHeader").style.display = "none";
      document.getElementById("bookingView").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });

      await buscarHorariosOcupados();
    }

    function voltarParaServicos() {
      document.getElementById("bookingView").classList.remove("active");
      document.getElementById("servicesView").style.display = "flex";
      document.getElementById("mainHeader").style.display = "block";
    }

    function renderizarSabados(sabados) {
      const grid = document.getElementById("saturdaysGrid");
      grid.innerHTML = "";

      sabados.forEach((sab, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn" + (index === 0 ? " selected" : "");
        btn.innerText = sab.label;
        btn.onclick = () => {
          sabadoSelecionado = sab;
          horarioSelecionado = null;
          document.querySelectorAll("#saturdaysGrid .option-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          renderizarHorarios();
        };
        grid.appendChild(btn);
      });
    }

    function renderizarHorarios() {
      const grid = document.getElementById("timesGrid");
      grid.innerHTML = "";

      HORARIOS_SABADO.forEach(hora => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = hora;

        const jaOcupado = sabadoSelecionado && agendamentosOcupados.some(
          item => item.data === sabadoSelecionado.iso && item.hora === hora
        );

        if (jaOcupado) {
          btn.disabled = true;
          btn.innerText = `${hora} (Ocupado)`;
        }

        btn.onclick = () => {
          horarioSelecionado = hora;
          document.querySelectorAll("#timesGrid .option-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
        };
        grid.appendChild(btn);
      });
    }

    async function finalizarAgendamento() {
      const nome = document.getElementById("clientName").value.trim();
      const telefone = document.getElementById("clientPhone").value.trim();
      const btnConfirm = document.getElementById("confirmBtn");

      if (!sabadoSelecionado) {
        alert("Por favor, escolha um sábado.");
        return;
      }
      if (!horarioSelecionado) {
        alert("Por favor, escolha um horário.");
        return;
      }
      if (!nome || !telefone) {
        alert("Por favor, preencha seu nome e WhatsApp.");
        return;
      }

      btnConfirm.disabled = true;
      btnConfirm.innerText = "A reservar...";

      const { error } = await db
        .from("agendamentos")
        .insert([{
          servico: servicoSelecionado.nome,
          data: sabadoSelecionado.iso,
          hora: horarioSelecionado,
          cliente: nome,
          telefone: telefone
        }]);

      btnConfirm.disabled = false;
      btnConfirm.innerText = "Confirmar Agendamento ✓";

      if (error) {
        if (error.code === "23505") {
          alert("Ops! Alguém acabou de reservar esse horário. Escolha outro.");
          await buscarHorariosOcupados();
        } else {
          // MOSTRA O ERRO EXATO DO SUPABASE NA TELA
          alert("Erro do Supabase: " + error.message + " (Código: " + error.code + ")");
        }
        return;
      }

      document.getElementById("summaryBox").innerHTML = `
        <strong>Cliente:</strong> ${nome}<br>
        <strong>Procedimento:</strong> ${servicoSelecionado.nome}<br>
        <strong>Data:</strong> ${sabadoSelecionado.label}<br>
        <strong>Horário:</strong> ${horarioSelecionado}<br>
        <strong>Valor:</strong> R$ ${servicoSelecionado.preco}
      `;

      const textoZap = `Olá Erica! Acabei de agendar pelo site:\n\n` +
        `👤 *Cliente:* ${nome}\n` +
        `✨ *Serviço:* ${servicoSelecionado.nome} (R$ ${servicoSelecionado.preco})\n` +
        `📅 *Data:* ${sabadoSelecionado.label}\n` +
        `⏰ *Horário:* ${horarioSelecionado}\n` +
        `📱 *Contato:* ${telefone}`;

      const urlZap = `https://wa.me/${WHATSAPP_ERICA}?text=${encodeURIComponent(textoZap)}`;
      document.getElementById("whatsappLink").href = urlZap;

      const dataLimpa = sabadoSelecionado.iso.replace(/-/g, "");
      const [h, m] = horarioSelecionado.split(":");
      const totalMin = Number(h) * 60 + Number(m) + 90;
      const horaFim = String(Math.floor(totalMin / 60)).padStart(2, "0") + String(totalMin % 60).padStart(2, "0");
      const inicioISO = `${dataLimpa}T${h}${m}00`;
      const fimISO = `${dataLimpa}T${horaFim}00`;

      const tituloEvento = encodeURIComponent(`${servicoSelecionado.nome} - Erica Pertile`);
      const detalhesEvento = encodeURIComponent(`Atendimento de estética com Erica Pertile. Cliente: ${nome} (${telefone})`);
      document.getElementById("calendarLink").href =
        `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${tituloEvento}&dates=${inicioISO}/${fimISO}&details=${detalhesEvento}`;

      document.getElementById("bookingView").classList.remove("active");
      document.getElementById("successView").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetarApp() {
      document.getElementById("successView").classList.remove("active");
      document.getElementById("servicesView").style.display = "flex";
      document.getElementById("mainHeader").style.display = "block";
    }

    carregarServicos();
  </script>
